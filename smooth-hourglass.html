<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Hourglass Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 1.9em;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            width: 70px;
            padding: 10px;
            font-size: 1.1em;
            border: 2px solid #2c5364;
            border-radius: 8px;
            text-align: center;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        button {
            background: linear-gradient(135deg, #203a43 0%, #2c5364 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(44, 83, 100, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 83, 100, 0.6);
        }

        .countdown-display {
            font-size: 2.3em;
            font-weight: bold;
            color: #2c5364;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        #hourglassCanvas {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 15px 0;
        }

        .status {
            margin-top: 15px;
            font-size: 1.1em;
            color: #555;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        .complete-message {
            font-size: 1.4em;
            color: #28a745;
            font-weight: bold;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⧗ Smooth Hourglass Timer</h1>
        <div class="subtitle">Beautiful particle flow simulation</div>

        <div class="input-section" id="inputSection">
            <div class="input-group">
                <label for="hours">Hours:</label>
                <input type="number" id="hours" min="0" max="23" value="0">
                <label for="minutes">Minutes:</label>
                <input type="number" id="minutes" min="0" max="59" value="2">
                <label for="seconds">Seconds:</label>
                <input type="number" id="seconds" min="0" max="59" value="0">
            </div>
            <button id="startBtn">Start Timer</button>
        </div>

        <div class="countdown-display" id="countdown">00:00:00</div>

        <canvas id="hourglassCanvas" width="500" height="600"></canvas>

        <div class="status" id="status">Set your time and start!</div>

        <div class="hidden" id="controls">
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('hourglassCanvas');
        const ctx = canvas.getContext('2d');

        // Optimized physics settings
        const PHYSICS = {
            GRAVITY: 0.35,
            PARTICLE_RADIUS: 2.0,      // Smaller grains
            RADIUS_VARIANCE: 0.3,       // Less variance for uniform packing
            DAMPING: 0.995,             // Smoother motion
            BOUNCE: 0.15,               // Less bouncy for smoother flow
            FRICTION: 0.98,             // Minimal wall friction
            MAX_PARTICLES: 5000,        // More particles possible with smaller size
        };

        // Hourglass geometry
        const HOURGLASS = {
            centerX: canvas.width / 2,
            topY: 70,
            bottomY: 530,
            neckY: 300,
            topWidth: 180,
            bottomWidth: 180,
            neckWidth: 20,
        };

        let particles = [];
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isPaused = false;
        let animationFrameId = null;
        let particlesInTop = 0;
        let particlesPassed = 0;
        let targetFlowRate = 0; // particles per second
        let currentParticleRadius = 2.5; // Dynamic particle radius
        let currentRows = 40;
        let currentCols = 35;
        let currentNeckWidth = 20; // Dynamic neck width

        // PRECISION SYNC SYSTEM - Real-time feedback control
        let timerStartTime = 0;          // When timer started (ms)
        let lastSyncTime = 0;             // Last sync check (ms)
        let syncCheckInterval = 500;      // Check sync every 500ms
        let targetParticlesPerSecond = 0; // Expected flow rate
        let gravityAdjustment = 1.0;      // Multiplier for gravity (0.8 to 1.2)

        // PRECISE PHYSICS-BASED CALIBRATION
        // Calculated from: gravity, damping, collisions, neck geometry
        const CALIBRATION = {
            BASE_RADIUS: 2.0,           // Base particle radius in pixels (smaller grains)
            BASE_DIAMETER: 4.0,         // Base particle diameter

            // CRITICAL: Accurate flow rate calculation
            // Flow rate depends on: (particles across neck) × (velocity) × (packing efficiency)
            // - Neck width: 20px / diameter 4px = 5 particles across
            // - Terminal velocity through neck: ~8-12 px/frame (with collisions)
            // - Effective flow: ~1.5-2 particles/frame at 60 FPS
            // - 1.8 particles/frame × 60 FPS = 108 particles/second
            // - Adding 20% safety margin: 108 × 0.85 = 92 p/s (conservative)
            BASE_FLOW_RATE: 92,         // Conservative estimate (precision sync will fine-tune)

            BASE_NECK_WIDTH: 20,        // Base hourglass neck width
            MAX_PARTICLES: 4500,        // More particles fit with smaller size
            MIN_RADIUS: 1.2,            // Minimum particle radius (smaller)
            MAX_RADIUS: 3.5,            // Maximum particle radius (smaller)
            MIN_NECK_WIDTH: 10,         // Minimum neck width (narrower for slow flow)
            MAX_NECK_WIDTH: 35,         // Maximum neck width (for fast flow)
        };

        /**
         * Calculate optimal particle parameters based on timer duration
         * Flow rate ∝ (neck_width)² × (particle_diameter)^-2
         * Returns: { radius, neckWidth, rows, cols, estimatedParticles, estimatedFlowRate }
         */
        function calculateParticleParams(timerSeconds) {
            // Strategy:
            // 1. Pack as many particles as possible in chamber
            // 2. Adjust BOTH particle size AND neck width to control flow rate
            // 3. Flow rate = BASE_FLOW × (neck/BASE_NECK)² × (BASE_DIA/dia)²
            // 4. Prefer adjusting particle size first, then neck if needed

            const fillFactor = 0.75; // Higher fill factor with tighter packing
            const aspectRatio = 1.2; // Slightly more vertical

            // Calculate grid dimensions for max particles
            let targetParticles = CALIBRATION.MAX_PARTICLES;
            let gridCells = targetParticles / fillFactor;
            let cols = Math.round(Math.sqrt(gridCells / aspectRatio));
            let rows = Math.round(cols * aspectRatio);
            let clampedRows = Math.max(25, Math.min(70, rows));
            let clampedCols = Math.max(20, Math.min(60, cols));

            // Actual particles we can fit after clamping
            const actualMaxParticles = Math.round(clampedRows * clampedCols * fillFactor);

            // Required flow rate using actual particle count
            const requiredFlowRate = actualMaxParticles / timerSeconds;

            // Calculate combined scaling factor needed
            const flowScaleFactor = requiredFlowRate / CALIBRATION.BASE_FLOW_RATE;

            // Flow = BASE × (neck/BASE_NECK)² × (BASE_DIA/dia)²
            // flowScaleFactor = (neck/BASE_NECK)² × (BASE_DIA/dia)²

            // Strategy: Try to achieve target with particle size first
            // Then adjust neck width if particle size is clamped

            // Start with base neck width
            let neckWidth = CALIBRATION.BASE_NECK_WIDTH;
            let radius = CALIBRATION.BASE_RADIUS;

            // Calculate required diameter scaling
            // (BASE_DIA/dia)² = flowScaleFactor / (neck/BASE_NECK)²
            // With base neck: (BASE_DIA/dia)² = flowScaleFactor
            let diameterScale = 1.0 / Math.sqrt(flowScaleFactor);
            let targetDiameter = CALIBRATION.BASE_DIAMETER * diameterScale;
            let targetRadius = targetDiameter / 2;

            // Check if radius is within bounds
            if (targetRadius < CALIBRATION.MIN_RADIUS) {
                // Need faster flow, but hit min radius
                // Widen the neck to compensate
                radius = CALIBRATION.MIN_RADIUS;
                const radiusContribution = Math.pow(CALIBRATION.BASE_DIAMETER / (radius * 2), 2);
                const neckScaleNeeded = Math.sqrt(flowScaleFactor / radiusContribution);
                neckWidth = CALIBRATION.BASE_NECK_WIDTH * neckScaleNeeded;
                neckWidth = Math.min(CALIBRATION.MAX_NECK_WIDTH, neckWidth);
            } else if (targetRadius > CALIBRATION.MAX_RADIUS) {
                // Need slower flow, but hit max radius
                // Narrow the neck to compensate
                radius = CALIBRATION.MAX_RADIUS;
                const radiusContribution = Math.pow(CALIBRATION.BASE_DIAMETER / (radius * 2), 2);
                const neckScaleNeeded = Math.sqrt(flowScaleFactor / radiusContribution);
                neckWidth = CALIBRATION.BASE_NECK_WIDTH * neckScaleNeeded;
                neckWidth = Math.max(CALIBRATION.MIN_NECK_WIDTH, neckWidth);
            } else {
                // Radius is fine, use it
                radius = targetRadius;
            }

            // Calculate actual flow rate with final radius and neck width
            const actualDiameter = radius * 2;

            // IMPROVED FLOW RATE FORMULA
            // Flow rate depends on:
            // 1. Cross-sectional area of neck: (neckWidth)²
            // 2. Particle throughput: particles_across × velocity
            // 3. Particle size: smaller particles = more fit across, faster flow

            // Particles that fit across neck
            const particlesAcrossBase = CALIBRATION.BASE_NECK_WIDTH / CALIBRATION.BASE_DIAMETER;
            const particlesAcrossActual = neckWidth / actualDiameter;

            // Flow rate scales with: (particles_across)^1.5 × (neck_width / particle_diameter)^0.5
            // This accounts for both geometry and velocity effects
            const flowRatio = Math.pow(particlesAcrossActual / particlesAcrossBase, 1.5);

            // Apply scaling to base flow rate
            const actualFlowRate = CALIBRATION.BASE_FLOW_RATE * flowRatio;

            return {
                radius: radius,
                neckWidth: neckWidth,
                rows: clampedRows,
                cols: clampedCols,
                estimatedParticles: actualMaxParticles,
                estimatedFlowRate: actualFlowRate,
                estimatedDuration: Math.round(actualMaxParticles / actualFlowRate)
            };
        }

        const hoursInput = document.getElementById('hours');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const countdownDisplay = document.getElementById('countdown');
        const inputSection = document.getElementById('inputSection');
        const controls = document.getElementById('controls');
        const status = document.getElementById('status');

        class Particle {
            constructor(x, y, customRadius = null) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = 0;
                // Use custom radius if provided, otherwise use current dynamic radius
                const baseRadius = customRadius !== null ? customRadius : currentParticleRadius;
                this.radius = baseRadius + (Math.random() - 0.5) * PHYSICS.RADIUS_VARIANCE;
                this.inTopChamber = (y < HOURGLASS.neckY);

                // Beautiful golden sand colors
                const hue = 35 + Math.random() * 15; // Golden to amber
                const sat = 65 + Math.random() * 20;
                const light = 50 + Math.random() * 15;
                this.color = `hsl(${hue}, ${sat}%, ${light}%)`;
            }

            update() {
                if (isPaused) return;

                // Apply gravity
                this.vy += PHYSICS.GRAVITY;

                // Apply damping
                this.vx *= PHYSICS.DAMPING;
                this.vy *= PHYSICS.DAMPING;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Boundary constraints
                this.constrainToHourglass();
            }

            constrainToHourglass() {
                const isTop = this.y < HOURGLASS.neckY;

                if (isTop) {
                    // Top chamber
                    const relY = this.y - HOURGLASS.topY;
                    const height = HOURGLASS.neckY - HOURGLASS.topY;
                    const t = Math.max(0, Math.min(1, relY / height));
                    const width = HOURGLASS.topWidth - (HOURGLASS.topWidth - HOURGLASS.neckWidth) * t;

                    const left = HOURGLASS.centerX - width / 2 + this.radius;
                    const right = HOURGLASS.centerX + width / 2 - this.radius;

                    // Wall collisions with friction
                    if (this.x < left) {
                        this.x = left;
                        this.vx = Math.abs(this.vx) * PHYSICS.BOUNCE;
                        this.vy *= PHYSICS.FRICTION;
                    }
                    if (this.x > right) {
                        this.x = right;
                        this.vx = -Math.abs(this.vx) * PHYSICS.BOUNCE;
                        this.vy *= PHYSICS.FRICTION;
                    }

                    // Top boundary
                    if (this.y < HOURGLASS.topY + this.radius) {
                        this.y = HOURGLASS.topY + this.radius;
                        this.vy = Math.abs(this.vy) * PHYSICS.BOUNCE;
                        this.vx *= PHYSICS.FRICTION;
                    }
                } else {
                    // Bottom chamber
                    const relY = this.y - HOURGLASS.neckY;
                    const height = HOURGLASS.bottomY - HOURGLASS.neckY;
                    const t = Math.max(0, Math.min(1, relY / height));
                    const width = HOURGLASS.neckWidth + (HOURGLASS.bottomWidth - HOURGLASS.neckWidth) * t;

                    const left = HOURGLASS.centerX - width / 2 + this.radius;
                    const right = HOURGLASS.centerX + width / 2 - this.radius;

                    // Wall collisions with friction
                    if (this.x < left) {
                        this.x = left;
                        this.vx = Math.abs(this.vx) * PHYSICS.BOUNCE;
                        this.vy *= PHYSICS.FRICTION;
                    }
                    if (this.x > right) {
                        this.x = right;
                        this.vx = -Math.abs(this.vx) * PHYSICS.BOUNCE;
                        this.vy *= PHYSICS.FRICTION;
                    }

                    // Bottom boundary - particles settle here
                    if (this.y > HOURGLASS.bottomY - this.radius) {
                        this.y = HOURGLASS.bottomY - this.radius;
                        this.vy = 0;
                        this.vx *= PHYSICS.FRICTION;
                    }
                }
            }

            // Simple particle-particle collision (optimized)
            checkCollision(other) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const minDist = this.radius + other.radius;

                if (dist < minDist && dist > 0) {
                    // Push apart
                    const overlap = minDist - dist;
                    const nx = dx / dist;
                    const ny = dy / dist;

                    this.x -= nx * overlap * 0.5;
                    this.y -= ny * overlap * 0.5;
                    other.x += nx * overlap * 0.5;
                    other.y += ny * overlap * 0.5;

                    // Simple velocity exchange
                    const relVx = other.vx - this.vx;
                    const relVy = other.vy - this.vy;
                    const relVn = relVx * nx + relVy * ny;

                    if (relVn < 0) {
                        const impulse = relVn * 0.5;
                        this.vx += nx * impulse;
                        this.vy += ny * impulse;
                        other.vx -= nx * impulse;
                        other.vy -= ny * impulse;
                    }
                }
            }

            draw() {
                // Beautiful gradient for each particle
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius * 0.3,
                    this.y - this.radius * 0.3,
                    0,
                    this.x,
                    this.y,
                    this.radius
                );

                gradient.addColorStop(0, this.lightenColor(this.color, 30));
                gradient.addColorStop(0.5, this.color);
                gradient.addColorStop(1, this.darkenColor(this.color, 20));

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.4, this.y - this.radius * 0.4, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }

            lightenColor(hsl, percent) {
                const match = hsl.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
                if (match) {
                    const h = match[1];
                    const s = match[2];
                    const l = Math.min(100, parseInt(match[3]) + percent);
                    return `hsl(${h}, ${s}%, ${l}%)`;
                }
                return hsl;
            }

            darkenColor(hsl, percent) {
                const match = hsl.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
                if (match) {
                    const h = match[1];
                    const s = match[2];
                    const l = Math.max(0, parseInt(match[3]) - percent);
                    return `hsl(${h}, ${s}%, ${l}%)`;
                }
                return hsl;
            }
        }

        function drawHourglassFrame() {
            ctx.save();

            // Glass effect
            const glassGradient = ctx.createLinearGradient(
                HOURGLASS.centerX - 100,
                0,
                HOURGLASS.centerX + 100,
                canvas.height
            );
            glassGradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
            glassGradient.addColorStop(0.5, 'rgba(220, 240, 255, 0.1)');
            glassGradient.addColorStop(1, 'rgba(255, 255, 255, 0.15)');

            // Top chamber
            ctx.beginPath();
            ctx.moveTo(HOURGLASS.centerX - HOURGLASS.topWidth / 2, HOURGLASS.topY);
            ctx.lineTo(HOURGLASS.centerX + HOURGLASS.topWidth / 2, HOURGLASS.topY);
            ctx.lineTo(HOURGLASS.centerX + HOURGLASS.neckWidth / 2, HOURGLASS.neckY);
            ctx.lineTo(HOURGLASS.centerX - HOURGLASS.neckWidth / 2, HOURGLASS.neckY);
            ctx.closePath();
            ctx.fillStyle = glassGradient;
            ctx.fill();
            ctx.strokeStyle = 'rgba(150, 180, 200, 0.6)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Bottom chamber
            ctx.beginPath();
            ctx.moveTo(HOURGLASS.centerX - HOURGLASS.neckWidth / 2, HOURGLASS.neckY);
            ctx.lineTo(HOURGLASS.centerX + HOURGLASS.neckWidth / 2, HOURGLASS.neckY);
            ctx.lineTo(HOURGLASS.centerX + HOURGLASS.bottomWidth / 2, HOURGLASS.bottomY);
            ctx.lineTo(HOURGLASS.centerX - HOURGLASS.bottomWidth / 2, HOURGLASS.bottomY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Wooden frame
            const wood = ctx.createLinearGradient(0, 0, canvas.width, 0);
            wood.addColorStop(0, '#5d4037');
            wood.addColorStop(0.5, '#6d4c41');
            wood.addColorStop(1, '#5d4037');

            ctx.fillStyle = wood;
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 2;

            // Top frame
            const topFrameY = HOURGLASS.topY - 20;
            ctx.fillRect(HOURGLASS.centerX - HOURGLASS.topWidth / 2 - 15, topFrameY, HOURGLASS.topWidth + 30, 20);
            ctx.strokeRect(HOURGLASS.centerX - HOURGLASS.topWidth / 2 - 15, topFrameY, HOURGLASS.topWidth + 30, 20);

            // Bottom frame
            ctx.fillRect(HOURGLASS.centerX - HOURGLASS.bottomWidth / 2 - 15, HOURGLASS.bottomY, HOURGLASS.bottomWidth + 30, 20);
            ctx.strokeRect(HOURGLASS.centerX - HOURGLASS.bottomWidth / 2 - 15, HOURGLASS.bottomY, HOURGLASS.bottomWidth + 30, 20);

            // Middle connector
            ctx.fillRect(HOURGLASS.centerX - 15, HOURGLASS.neckY - 8, 30, 16);
            ctx.strokeRect(HOURGLASS.centerX - 15, HOURGLASS.neckY - 8, 30, 16);

            // Decorative details
            ctx.fillStyle = '#4e342e';
            ctx.fillRect(HOURGLASS.centerX - HOURGLASS.topWidth / 2 - 18, topFrameY - 3, HOURGLASS.topWidth + 36, 3);
            ctx.fillRect(HOURGLASS.centerX - HOURGLASS.bottomWidth / 2 - 18, HOURGLASS.bottomY + 20, HOURGLASS.bottomWidth + 36, 3);

            ctx.restore();
        }

        /**
         * PRECISION SYNC SYSTEM
         * Monitors actual vs expected progress and adjusts gravity for perfect timing
         */
        function checkAndAdjustSync() {
            if (isPaused || totalSeconds === 0) return;

            const now = Date.now();

            // Check sync every 500ms
            if (now - lastSyncTime < syncCheckInterval) return;
            lastSyncTime = now;

            // Calculate elapsed time in seconds
            const elapsedSeconds = (now - timerStartTime) / 1000;
            if (elapsedSeconds < 0.5) return; // Wait at least 0.5s before adjusting

            // Expected particles that should have passed by now
            const expectedPassed = targetParticlesPerSecond * elapsedSeconds;

            // Actual particles that have passed
            const actualPassed = particlesPassed;

            // Calculate error (positive = too slow, negative = too fast)
            const error = expectedPassed - actualPassed;
            const errorPercent = (error / expectedPassed) * 100;

            // Adaptive threshold: stricter early on, more lenient later
            const progressRatio = elapsedSeconds / totalSeconds;
            const errorThreshold = progressRatio < 0.3 ? 2 : 4; // Tighter tolerance early

            // Only adjust if error is significant and we're not near the end
            if (Math.abs(errorPercent) > errorThreshold && elapsedSeconds < totalSeconds - 2) {
                // Adaptive PID control: aggressive early, gentle later
                // Early (0-30%): kP = 0.01 (fast correction)
                // Middle (30-70%): kP = 0.005 (balanced)
                // Late (70-100%): kP = 0.003 (gentle fine-tuning)
                let kP;
                if (progressRatio < 0.3) {
                    kP = 0.01; // Aggressive early correction
                } else if (progressRatio < 0.7) {
                    kP = 0.005; // Balanced mid-game
                } else {
                    kP = 0.003; // Gentle late-game
                }

                // If too slow (error > 0): increase gravity
                // If too fast (error < 0): decrease gravity
                const adjustment = error * kP;

                // Clamp gravity adjustment to reasonable range
                gravityAdjustment = Math.max(0.6, Math.min(1.5, gravityAdjustment + adjustment));

                // Apply adjusted gravity
                PHYSICS.GRAVITY = 0.35 * gravityAdjustment;

                // Update status with sync info (optional - for debugging)
                // Uncomment to see sync adjustments in real-time:
                // status.textContent = `Sync: ${errorPercent.toFixed(1)}% | G: ${gravityAdjustment.toFixed(3)}x | kP: ${kP}`;
            }
        }

        function animate() {
            // Clear with gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#f5f7fa');
            bgGradient.addColorStop(1, '#c3cfe2');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw frame
            drawHourglassFrame();

            // Track particles passing through neck (for statistics)
            particles.forEach(p => {
                const wasInTop = p.inTopChamber;
                p.inTopChamber = (p.y < HOURGLASS.neckY);

                // Particle just passed through the neck
                if (wasInTop && !p.inTopChamber) {
                    particlesPassed++;
                }
            });

            // PRECISION SYNC: Check and adjust flow rate in real-time
            checkAndAdjustSync();

            // Update particles
            particles.forEach(p => p.update());

            // Optimized collision detection - only check nearby particles
            // With more particles, reduce collision checks for performance
            const maxChecks = Math.min(6, Math.ceil(particles.length / 500));
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < Math.min(i + maxChecks, particles.length); j++) {
                    particles[i].checkCollision(particles[j]);
                }
            }

            // Draw particles
            particles.forEach(p => p.draw());

            animationFrameId = requestAnimationFrame(animate);
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function fillTopChamber() {
            // Calculate optimal particle parameters for timer duration
            const params = calculateParticleParams(totalSeconds);
            currentParticleRadius = params.radius;
            currentNeckWidth = params.neckWidth;
            currentRows = params.rows;
            currentCols = params.cols;

            // Update hourglass geometry with new neck width
            HOURGLASS.neckWidth = currentNeckWidth;

            // Fill the top chamber with particles
            particles = [];
            particlesPassed = 0;
            const chamberHeight = HOURGLASS.neckY - HOURGLASS.topY - 20;

            for (let row = 0; row < currentRows; row++) {
                for (let col = 0; col < currentCols; col++) {
                    // Calculate position in top chamber (triangular packing)
                    const relY = (row / currentRows) * chamberHeight;
                    const t = relY / chamberHeight;
                    const currentWidth = HOURGLASS.topWidth - (HOURGLASS.topWidth - HOURGLASS.neckWidth) * t;

                    // Tight hexagonal packing - no gaps between grains
                    const offset = (row % 2) * currentParticleRadius;
                    const spacing = currentParticleRadius * 2.0; // Exactly touching
                    const x = HOURGLASS.centerX - (currentWidth / 2) + offset + (col * spacing);
                    const y = HOURGLASS.topY + 10 + (row * spacing * 0.87); // 0.87 for hex packing

                    // Only add if within bounds
                    if (x > HOURGLASS.centerX - currentWidth / 2 + currentParticleRadius &&
                        x < HOURGLASS.centerX + currentWidth / 2 - currentParticleRadius) {
                        const particle = new Particle(x, y, currentParticleRadius);
                        particle.vx = 0;
                        particle.vy = 0;
                        particle.inTopChamber = true; // Track which chamber
                        particles.push(particle);
                    }
                }
            }

            particlesInTop = particles.length;
            // Calculate target flow rate: all particles should pass through in totalSeconds
            targetFlowRate = particlesInTop / totalSeconds; // particles per second
            targetParticlesPerSecond = targetFlowRate; // Store for sync system

            // Initialize precision sync system
            gravityAdjustment = 1.0;
            PHYSICS.GRAVITY = 0.35; // Reset to base gravity

            status.textContent = `${particles.length} grains (r=${params.radius.toFixed(1)}px, neck=${params.neckWidth.toFixed(0)}px) - PRECISION SYNC Active`;
        }

        function startTimer() {
            const hours = parseInt(hoursInput.value) || 0;
            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;

            totalSeconds = hours * 3600 + minutes * 60 + seconds;

            if (totalSeconds <= 0) {
                alert('Please enter a valid time!');
                return;
            }

            remainingSeconds = totalSeconds;
            isPaused = false;

            // Fill top chamber with sand
            fillTopChamber();

            // Initialize precision sync timing
            timerStartTime = Date.now();
            lastSyncTime = timerStartTime;

            inputSection.classList.add('hidden');
            controls.classList.remove('hidden');
            status.textContent = 'Watch the sand flow naturally!';
            status.classList.remove('complete-message');

            updateDisplay();

            if (!animationFrameId) {
                animate();
            }

            timerInterval = setInterval(() => {
                if (!isPaused && remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();

                    if (remainingSeconds === 0) {
                        completeTimer();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            const wasPaused = isPaused;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
            status.textContent = isPaused ? 'Paused' : 'Timer running...';

            // Adjust timer start time when resuming to account for pause duration
            if (!isPaused && wasPaused) {
                // Resuming: adjust start time forward by pause duration
                const now = Date.now();
                const pauseDuration = now - lastSyncTime;
                timerStartTime += pauseDuration;
                lastSyncTime = now;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrameId);
            timerInterval = null;
            animationFrameId = null;
            isPaused = false;
            remainingSeconds = 0;
            totalSeconds = 0;
            particles = [];
            particlesInTop = 0;
            particlesPassed = 0;
            PHYSICS.GRAVITY = 0.35; // Reset gravity to default
            HOURGLASS.neckWidth = CALIBRATION.BASE_NECK_WIDTH; // Reset neck width

            inputSection.classList.remove('hidden');
            controls.classList.add('hidden');
            countdownDisplay.textContent = '00:00:00';
            status.textContent = 'Set your time and start!';
            status.classList.remove('complete-message');
            pauseBtn.textContent = 'Pause';

            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#f5f7fa');
            bgGradient.addColorStop(1, '#c3cfe2');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawHourglassFrame();
        }

        function completeTimer() {
            clearInterval(timerInterval);
            isPaused = true;
            status.textContent = '✓ Time\'s up!';
            status.classList.add('complete-message');
        }

        function updateDisplay() {
            countdownDisplay.textContent = formatTime(remainingSeconds);
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        hoursInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startTimer();
        });
        minutesInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startTimer();
        });
        secondsInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startTimer();
        });

        // Initial draw
        const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGradient.addColorStop(0, '#f5f7fa');
        bgGradient.addColorStop(1, '#c3cfe2');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawHourglassFrame();
    </script>
</body>
</html>
